version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      app-dependencies:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /cloudflare-worker
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      worker-dependencies:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /now-playing-service
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      service-dependencies:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      workflow-actions:
        patterns: ['*']
