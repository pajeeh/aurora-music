name: Segurança
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
  security-events: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Auditar aplicação e ferramentas de build
        run: npm audit --audit-level=high
      - name: Auditar serviços e integrações
        run: |
          npm audit --prefix connect-service --audit-level=high
          npm audit --prefix now-playing-service --audit-level=high
          npm audit --prefix cloudflare-worker --audit-level=high
          npm audit --prefix platforms/discord-companion --audit-level=high
  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
