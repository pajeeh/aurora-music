name: Disponibilidade pública
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verificar Aurora Web
        run: curl --fail --silent --show-error --location --max-time 20 https://pajeeh.github.io/aurora-music/ --output /dev/null
      - name: Verificar serviços públicos
        run: |
          response="$(curl --fail --silent --show-error --max-time 20 https://aurora-edge.aurora-edge.workers.dev/health)"
          test "$response" = '{"ok":true}'
